
name: Build GlassNX HOME

on: [push, pull_request, workflow_dispatch]

jobs:
  uLaunch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
    - uses: actions/checkout@master
      with:
        submodules: recursive

    - name: Update packages and install Python
      run: |
        sudo -n apt-get update
        sudo -n apt-get install -y --no-install-recommends patch autoconf automake diffutils pkgconf fakeroot git maven file tar bzip2 zstd python3 python3-requests python3-pil python-is-python3 zip ca-certificates
        sudo -n dkp-pacman --noconfirm -U \
          "https://wii.leseratte10.de/devkitPro/other-stuff/dkp-toolchain-vars-1.0.2-1-any.pkg.tar.xz"

    - name: Set workspace permissions
      run: chmod 777 -R "$GITHUB_WORKSPACE"
    
    - name: Prepare master libnx
      run: |
        git clone https://github.com/switchbrew/libnx
        make -C libnx/
        cp -r libnx/nx/external/bsd/include libnx/nx
    
    - name: Compile
      run: |
        make -j$(nproc) LIBNX=$PWD/libnx/nx/ usystem uloader umenu umanager
        test -s SdOut/glassnx/bin/uMenu/main
        test -s SdOut/glassnx/bin/uMenu/romfs.bin
        test -s SdOut/switch/GlassNXManager.nro
        cmp SdOut/glassnx/bin/uSystem/exefs.nsp SdOut/atmosphere/contents/0100000000001000/exefs.nsp
        grep -Fq '"/glassnx/bin/uMenu"' projects/uSystem/source/main.cpp
        grep -aFq 'GlassNX v0.25' projects/uMenu/uMenu.elf
        printf 'GlassNX v0.25\nCommit: %s\n' "$GITHUB_SHA" > SdOut/glassnx/BUILD.txt
        test -s /etc/ssl/certs/ca-certificates.crt
        cp /etc/ssl/certs/ca-certificates.crt SdOut/glassnx/cacert.pem
        mkdir -p SdOut/glassnx/desktop-tools
        cp tools/glassnx_artwork.py tools/glassnx_presence.py tools/GLASSNX-INTEGRATIONS.md tools/GLASSNX-HARDWARE-QA.md SdOut/glassnx/desktop-tools/
        python3 -m py_compile tools/glassnx_artwork.py tools/glassnx_presence.py
        python3 tests/test_presence.py
        (cd SdOut && zip -r ../GlassNX-v0.25.zip atmosphere glassnx switch)
        unzip -t GlassNX-v0.25.zip
        python3 tools/check_glassnx_package.py GlassNX-v0.25.zip
        
    - uses: actions/upload-artifact@master
      with:
        name: GlassNX-v0.25
        path: GlassNX-v0.25.zip
        if-no-files-found: error

  material-smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install host SDL and Mesa
      run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-image-dev libgl1-mesa-dri g++
    - name: Validate production glass material with Mesa
      run: |
        g++ -std=c++17 -Wall -Wextra -Werror -Iprojects/uMenu/include \
          tests/liquid_glass.cpp projects/uMenu/source/ul/menu/ui/ui_LiquidGlass.cpp \
          $(sdl2-config --cflags --libs) -o /tmp/liquid-glass-smoke
        SDL_VIDEODRIVER=offscreen /tmp/liquid-glass-smoke

    - name: Validate artwork dimensions and cropping
      run: |
        g++ -std=c++17 -Wall -Wextra -Werror -Ilibs/uCommon/include tests/artwork.cpp $(pkg-config --cflags --libs sdl2 SDL2_image) -o /tmp/glassnx-artwork-test
        /tmp/glassnx-artwork-test

  publish-release:
    # Publish only from the GlassNX branch, after both native and host checks pass.
    if: github.repository == 'gavin02031/uLaunch' && github.ref == 'refs/heads/glassnx' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [uLaunch, material-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: glassnx-release
      cancel-in-progress: false
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: GlassNX-v*
        path: release-package
        merge-multiple: true
    - name: Publish verified direct ZIP
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        packages=(release-package/GlassNX-v*.zip)
        [[ ${#packages[@]} -eq 1 ]]
        package="${packages[0]}"
        filename="$(basename "$package")"
        [[ "$filename" =~ ^GlassNX-v[0-9]+\.[0-9]+(\.[0-9]+)?\.zip$ ]]
        tag="${filename%.zip}"
        unzip -t "$package"
        unzip -p "$package" glassnx/BUILD.txt | grep -Fx "Commit: $GITHUB_SHA"
        # Never silently replace an existing version or move its tag.
        if gh release view "$tag" --json tagName,assets > existing-release.json 2>/dev/null; then
          echo "Release $tag already exists; leaving it unchanged."
          exit 0
        fi
        # A tag may already exist after a failed publish; verify its commit.
        if existing=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null); then
          [[ "$existing" == "$GITHUB_SHA" ]] || { echo "Existing tag points at another commit"; exit 1; }
        else
          gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" >/dev/null
        fi
        sha256sum "$package" | sed 's|release-package/||' > "$package.sha256"
        printf '%s\n' "GlassNX development build from $GITHUB_SHA." "" "Native compilation, archive validation and host smoke tests passed. Switch hardware validation is still required." "" "Download $filename directly (not Source code). For an existing compatible GlassNX installation, transfer it intact to /glassnx/update.zip and use GlassNX Manager. Keep an SD backup." > release-notes.txt
        gh release create "$tag" "$package" "$package.sha256" --verify-tag --title "$tag" --notes-file release-notes.txt --prerelease
