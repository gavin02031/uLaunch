
name: Build GlassNX HOME

on: [push, pull_request, workflow_dispatch]

jobs:
  uLaunch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
    - uses: actions/checkout@master
      with:
        submodules: recursive

    - name: Update packages and install Python
      run: |
        sudo -n apt-get update
        sudo -n apt-get install -y --no-install-recommends patch autoconf automake diffutils pkgconf fakeroot git maven file tar bzip2 zstd python3 python3-requests python-is-python3 zip ca-certificates
        sudo -n dkp-pacman --noconfirm -U \
          "https://wii.leseratte10.de/devkitPro/other-stuff/dkp-toolchain-vars-1.0.2-1-any.pkg.tar.xz"

    - name: Set workspace permissions
      run: chmod 777 -R "$GITHUB_WORKSPACE"
    
    - name: Prepare master libnx
      run: |
        git clone https://github.com/switchbrew/libnx
        make -C libnx/
        cp -r libnx/nx/external/bsd/include libnx/nx
    
    - name: Compile
      run: |
        make -j$(nproc) LIBNX=$PWD/libnx/nx/ usystem uloader umenu umanager
        test -s SdOut/glassnx/bin/uMenu/main
        test -s SdOut/glassnx/bin/uMenu/romfs.bin
        test -s SdOut/switch/GlassNXManager.nro
        cmp SdOut/glassnx/bin/uSystem/exefs.nsp SdOut/atmosphere/contents/0100000000001000/exefs.nsp
        grep -Fq '"/glassnx/bin/uMenu"' projects/uSystem/source/main.cpp
        grep -aFq 'GlassNX v0.15' projects/uMenu/uMenu.elf
        printf 'GlassNX v0.15\nCommit: %s\n' "$GITHUB_SHA" > SdOut/glassnx/BUILD.txt
        test -s /etc/ssl/certs/ca-certificates.crt
        cp /etc/ssl/certs/ca-certificates.crt SdOut/glassnx/cacert.pem
        mkdir -p SdOut/glassnx/desktop-tools
        cp tools/glassnx_artwork.py tools/GLASSNX-INTEGRATIONS.md SdOut/glassnx/desktop-tools/
        python3 -m py_compile tools/glassnx_artwork.py
        (cd SdOut && zip -r ../GlassNX-v0.15.zip atmosphere glassnx switch)
        unzip -t GlassNX-v0.15.zip
        python3 tools/check_glassnx_package.py GlassNX-v0.15.zip
        
    - uses: actions/upload-artifact@master
      with:
        name: GlassNX-v0.15
        path: GlassNX-v0.15.zip
        if-no-files-found: error

  material-smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install host SDL and Mesa
      run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libgl1-mesa-dri g++
    - name: Validate production glass material with Mesa
      run: |
        g++ -std=c++17 -Wall -Wextra -Werror -Iprojects/uMenu/include \
          tests/liquid_glass.cpp projects/uMenu/source/ul/menu/ui/ui_LiquidGlass.cpp \
          $(sdl2-config --cflags --libs) -o /tmp/liquid-glass-smoke
        SDL_VIDEODRIVER=offscreen /tmp/liquid-glass-smoke
